@if (hero$ | async; as hero) {
  <section class="hero" id="home">
    <div class="hero__inner site-container">
      <h1>{{ hero.name }}</h1>

      <p class="hero__subtitle">
      {{ hero.subtitle[languageService.currentLanguage()] }}
      </p>

      <blockquote>
        {{ hero.quote[languageService.currentLanguage()] }}
      </blockquote>
    </div>

  </section>
}
